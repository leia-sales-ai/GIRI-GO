<!-- Supabase → Authentication → Email Templates → Magic Link: kompletten Body durch diesen ersetzen.
     Subject: GIRI Go – Anmelden -->
<div style="font-family:Montserrat,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#000">
  <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#004EAD;font-weight:800;margin-bottom:12px">GIRI Go</div>
  <h2 style="font-size:22px;margin:0 0 12px">Anmelden</h2>
  <p style="font-size:15px;line-height:1.5;margin:0 0 20px">Tippe auf den Button – du wirst direkt angemeldet. In der installierten App auf dem Handy: einfach den Code eingeben.</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#004EAD;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:10px">Jetzt anmelden</a></p>
  <p style="font-size:13px;color:#525252;margin:0 0 6px">Dein Code (1 Stunde gültig):</p>
  <p style="font-size:30px;font-weight:800;letter-spacing:.2em;margin:0 0 24px">{{ .Token }}</p>
  <p style="font-size:12px;color:#8A8A8A;margin:0">Nicht angefordert? Einfach ignorieren – der Link funktioniert nur einmal.</p>
</div>
