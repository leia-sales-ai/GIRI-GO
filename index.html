.sync.err{background:var(--red)}
.magic{text-align:center;padding:10px 0}
.magic .big{font-size:40px;margin-bottom:8px}
.profile-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#161616; --surface-2:#222; --line:#333;
    --ink:#F5F5F5; --ink-2:#D4D4D4; --ink-3:#8A8A8A;
    --accent:#3B7DE0; --blue-lightest:#0F1E33; --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --surface-2:#222; --line:#333;
  --ink:#F5F5F5; --ink-2:#D4D4D4; --ink-3:#8A8A8A;
  --accent:#3B7DE0; --blue-lightest:#0F1E33; --shadow:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.tnum{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}

/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:18px}
.brand .go{background:var(--mint);color:var(--navy);padding:1px 8px;border-radius:6px;font-size:13px;letter-spacing:.08em}
.brand small{font-weight:500;opacity:.7;font-size:12px}
.topbar .spacer{flex:1}
.topbar .tb-btn{color:#fff;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.topbar .tb-btn:hover{background:rgba(255,255,255,.2)}
.page{flex:1;width:100%;max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
.page-narrow{max-width:520px}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;background:var(--accent);color:#fff;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.mint{background:var(--mint);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.icon{padding:9px;border-radius:50%;width:38px;height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:80px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.chip.draft{background:var(--surface-2);color:var(--ink-2)}
.chip.review{background:rgba(245,165,36,.18);color:#9a6300}
.chip.published{background:rgba(3,211,155,.18);color:var(--mint-ink)}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(1,39,86,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h2{font-size:18px;margin-bottom:12px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.kbd{font:600 11px/1 var(--font);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-3)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:8px}
.example-tag{background:var(--yellow);color:#3a2d00;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.05em}

/* ---------- Login ---------- */
.login-wrap{max-width:440px;margin:40px auto;padding:28px}
.login-wrap h1{font-size:26px;margin-bottom:6px}
.login-wrap p{color:var(--ink-2);margin:0 0 20px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.role-grid button{padding:12px 6px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13px;background:var(--surface);color:var(--ink-2)}
.role-grid button.on{border-color:var(--blue);color:var(--blue);background:rgba(0,78,173,.07)}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{font-size:24px}
.dash-head .sub{color:var(--ink-2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.list{display:grid;gap:12px}
.instr{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;align-items:center}
@media(max-width:560px){.instr{grid-template-columns:72px 1fr}}
.instr .thumb{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface-2);object-fit:cover;display:block}
.instr .title{font-weight:700;font-size:16px;margin-bottom:4px}
.instr .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.instr .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.instr .acts .btn{padding:7px 12px;font-size:12px}

/* ---------- Capture ---------- */
.capture{position:fixed;inset:0;background:#000;color:#fff;z-index:40;display:flex;flex-direction:column;overflow:hidden}
.capture video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.capture video.mirror{transform:scaleX(-1)}
.cap-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.cap-top .ttl{font-weight:700;font-size:14px;flex:1;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.cap-top .cnt{font-weight:800;font-size:13px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px}
.cap-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cap-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cap-strip::-webkit-scrollbar{display:none}
.cap-strip .st{flex:0 0 auto;width:48px;height:48px;border-radius:8px;overflow:hidden;position:relative;background:#222;border:2px solid transparent}
.cap-strip .st img{width:100%;height:100%;object-fit:cover;display:block}
.cap-strip .st i{position:absolute;left:0;bottom:0;font-style:normal;font-size:10px;font-weight:800;background:rgba(0,0,0,.6);padding:1px 5px;border-top-right-radius:6px}
.cap-ctrls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap-ctrls .side{width:64px;display:flex;justify-content:center}
.round{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.shutter{position:relative;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.shutter svg{position:absolute;inset:0;transform:rotate(-90deg)}
.shutter .ring-bg{fill:none;stroke:rgba(255,255,255,.35);stroke-width:5}
.shutter .ring{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke .3s}
.shutter .core{width:64px;height:64px;border-radius:50%;background:#fff;transition:transform .12s,background .2s,border-radius .2s}
.shutter.rec .core{background:var(--red);transform:scale(.6);border-radius:18px}
.shutter.tl-orange .ring{stroke:var(--amber)}
.shutter.tl-red .ring{stroke:var(--red)}
.cap-timer{text-align:center;font-weight:800;font-size:15px;min-height:22px;margin-bottom:8px;letter-spacing:.02em}
.cap-timer.warn{color:var(--amber)}
.cap-timer.bad{color:var(--red)}
.cap-hint{text-align:center;font-size:12px;opacity:.75;margin-top:10px}
.zoom{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.zoom input[type=range]{writing-mode:vertical-lr;direction:rtl;height:140px;width:28px;accent-color:var(--mint)}
.zoom span{font-size:11px;font-weight:700;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
.focus-ring{position:absolute;width:64px;height:64px;border:2px solid var(--mint);border-radius:12px;transform:translate(-50%,-50%) scale(1.4);opacity:0;pointer-events:none;z-index:3;transition:transform .25s,opacity .25s}
.focus-ring.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.on{animation:flash .35s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.cap-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:2;background:var(--navy)}
.cap-fallback p{max-width:360px;opacity:.85;font-size:14px}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.editor{grid-template-columns:1fr}}
.ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ed-head input.title{font-size:20px;font-weight:800;border:0;background:transparent;padding:6px 0;border-bottom:2px solid transparent;min-width:200px;flex:1}
.ed-head input.title:focus{border-bottom-color:var(--mint);outline:0}
.steps-panel{padding:12px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
@media(max-width:900px){.steps-panel{position:static;max-height:none}}
.steps-panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.steps-panel .ph b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.slist{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:22px 52px 1fr 28px;gap:8px;align-items:center;padding:6px;border-radius:10px;border:1.5px solid transparent;background:var(--surface);cursor:pointer;user-select:none}
.srow:hover{background:var(--surface-2)}
.srow.sel{border-color:var(--blue);background:rgba(0,78,173,.06)}
.srow.dragging{opacity:.35}
.srow.over{box-shadow:0 -3px 0 var(--mint)}
.srow .n{font-size:11px;font-weight:800;color:var(--ink-3);text-align:right}
.srow .th{width:52px;height:52px;border-radius:7px;object-fit:cover;background:#111;display:block;position:relative}
.srow .th-wrap{position:relative;width:52px;height:52px}
.srow .th-wrap .vd{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:4px}
.srow .tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .tt small{display:block;font-weight:500;color:var(--ink-3);font-size:11px}
.srow .grip{color:var(--ink-3);font-size:18px;cursor:grab;text-align:center;touch-action:none;padding:4px 0}
.chrow{display:flex;align-items:center;gap:8px;padding:10px 6px 4px;margin-top:6px}
.chrow input{flex:1;border:0;background:transparent;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);border-bottom:1.5px dashed transparent}
.chrow input:focus{border-bottom-color:var(--blue);outline:0}
.chrow .x{color:var(--ink-3);font-size:16px}
.ed-main{display:flex;flex-direction:column;gap:14px}
.stage{padding:14px}
.media-box{position:relative;background:#000;border-radius:12px;overflow:hidden;width:100%;aspect-ratio:16/10;max-height:62vh;touch-action:none;margin-inline:auto}
.media-box video,.media-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.media-box canvas.ann{position:absolute;left:0;top:0;cursor:crosshair}
.media-box canvas.ann.sel-mode{cursor:default}
.media-box .pausetag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;pointer-events:none;opacity:.9}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tool{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.tool:hover{background:var(--surface-2)}
.tool.on{border-color:var(--blue);background:rgba(0,78,173,.1);color:var(--blue)}
.tool svg{width:22px;height:22px}
.tools .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--ink)}
.timeline{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.timeline .tl-row{display:flex;align-items:center;gap:10px}
.timeline .tl-row .tnum{font-size:12px;font-weight:700;color:var(--ink-2);width:52px}
.scrub{position:relative;flex:1;height:34px}
.scrub input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:34px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer}
.scrub input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue);border:2px solid #fff;pointer-events:auto;cursor:pointer}
.scrub input.trim::-webkit-slider-thumb{width:12px;height:26px;border-radius:4px;background:var(--mint);border:2px solid var(--navy)}
.scrub input.trim::-moz-range-thumb{width:12px;height:26px;border-radius:4px;background:var(--mint);border:2px solid var(--navy)}
.scrub .track{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:var(--line)}
.scrub .keep{position:absolute;top:14px;height:6px;background:var(--mint);border-radius:3px}
.scrub .mark{position:absolute;top:8px;width:4px;height:18px;border-radius:2px;background:var(--amber);transform:translateX(-2px)}
.ann-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ann-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600}
.ann-pill.on{outline:2px solid var(--blue)}
.ann-pill button{color:var(--ink-3);font-size:14px;line-height:1}
.props{padding:16px}
.props .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.props .two{grid-template-columns:1fr}}
.side-info{padding:16px}
.side-info h3{font-size:14px;margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;transition:background .2s;flex:0 0 auto}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle input:checked{background:var(--mint)}
.toggle input:checked::after{left:21px}
.shortcuts{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.approve-box{display:grid;gap:10px}
.appr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;flex-wrap:wrap}
.appr.ok{border-color:var(--mint);background:rgba(3,211,155,.08)}
.appr b{font-size:13px}
.appr small{display:block;color:var(--ink-3);font-size:11px}
.hist{font-size:12px;color:var(--ink-2);display:grid;gap:6px;margin-top:8px}
.hist div b{color:var(--ink)}

/* ---------- Viewer ---------- */
.viewer{position:fixed;inset:0;background:#02132B;color:#fff;z-index:40;display:flex;flex-direction:column}
.vw-top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(rgba(2,19,43,.85),transparent)}
.vw-top .tt-wrap{flex:1;min-width:0}
.vw-top .ttl{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-top .ch{font-size:11px;font-weight:700;color:var(--mint);letter-spacing:.06em;text-transform:uppercase}
.vw-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.vw-scroll::-webkit-scrollbar{display:none}
.vstep{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column}
.vstep .vmedia{flex:1;position:relative;background:#000;min-height:0}
.vstep .vmedia video,.vstep .vmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vstep .vmedia canvas{position:absolute;left:0;top:0;pointer-events:none}
.vstep .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.vstep .prog i{display:block;height:100%;width:0;background:var(--mint)}
.vstep .vtext{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));background:#02132B}
.vstep .vtext .num{font-size:11px;font-weight:800;color:var(--mint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.vstep .vtext h2{font-size:18px;margin-bottom:4px}
.vstep .vtext p{margin:0;color:#B8C6DB;font-size:14px;white-space:pre-wrap}
.vstep .vtext .warnbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(245,165,36,.18);color:var(--amber);font-weight:700;font-size:13px}
.vstep .chk{display:flex;gap:8px;margin-top:12px}
.vstep .chk .btn{flex:1;padding:12px}
.vstep .chk .done{background:var(--mint);color:var(--navy)}
.vstep .chk .done.off{background:rgba(255,255,255,.12);color:#fff}
.vstep .chk .nok{background:rgba(229,72,77,.2);color:#ff8a8e}
.vstep .chk .nok.on{background:var(--red);color:#fff}
.vw-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px;z-index:5;animation:bob 1.6s infinite;pointer-events:none;white-space:nowrap}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
.vw-side{position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);background:#0D2447;z-index:6;transform:translateX(100%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.4)}
.vw-side.open{transform:none}
.vw-side h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);margin:14px 0 6px}
.vw-side .it{display:flex;gap:8px;padding:8px 6px;border-radius:8px;font-size:13px;cursor:pointer;align-items:center}
.vw-side .it:hover{background:rgba(255,255,255,.08)}
.vw-side .it .n{font-weight:800;color:#7F93B3;width:26px;font-size:11px;text-align:right}
.vw-side .it.ok .n{color:var(--mint)}
.vw-side .it.nok .n{color:var(--red)}
.vw-start{position:absolute;inset:0;z-index:7;background:#02132B;display:flex;align-items:center;justify-content:center;padding:24px}
.vw-start .card{background:#0D2447;color:#fff;padding:24px;max-width:420px;width:100%}
.vw-start h1{font-size:22px;margin-bottom:6px}
.vw-start .field input{background:#12305C;border-color:#22437A;color:#fff}
.vw-start .field label{color:#7F93B3}
.vw-end{position:absolute;inset:0;z-index:7;background:#02132B;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
/* chapter overview */
.vw-chap{position:absolute;inset:0;z-index:8;background:#02132B;color:#fff;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));animation:chfade .25s ease}
.vw-chap.out{animation:chout .22s ease forwards}
@keyframes chfade{from{opacity:0}to{opacity:1}}
@keyframes chout{to{opacity:0;transform:scale(1.02)}}
.vw-chap .ch-head{max-width:960px;margin:0 auto 18px}
.vw-chap .ch-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.vw-chap .ch-bar .round{width:40px;height:40px;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.vw-chap .brandline{display:flex;align-items:center;gap:10px;color:var(--mint);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;min-width:0}
.vw-chap .brandline img{height:26px;max-width:120px;object-fit:contain}
.vw-chap h1{font-size:clamp(24px,4.5vw,36px);margin:0 0 6px;line-height:1.12;letter-spacing:-.02em}
.vw-chap .ch-sub{color:#9AA7BC;font-size:13px;font-weight:600}
.vw-chap .ch-sub2{color:#7F93B3;font-size:13px;margin-top:14px}
.ch-grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media(max-width:480px){.ch-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.ch-tile{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#0D2447;cursor:pointer;text-align:left;color:#fff;border:0;padding:0;isolation:isolate;transform:translateY(14px);opacity:0;animation:chin .55s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent}
@keyframes chin{to{transform:none;opacity:1}}
.ch-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ch-tile:hover img,.ch-tile:focus-visible img{transform:scale(1.06)}
.ch-tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,19,43,.05) 0%,rgba(2,19,43,.3) 45%,rgba(2,19,43,.92) 100%)}
.ch-tile:hover{outline:2px solid var(--mint)}
.ch-tile .cn{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.ch-tile .done{position:absolute;top:14px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.ch-tile .done svg{width:18px;height:18px}
.ch-tile .txt{position:absolute;left:14px;right:14px;bottom:14px;display:block}
.ch-tile .txt b{display:block;font-size:17px;line-height:1.2;margin-bottom:4px;text-shadow:0 2px 10px rgba(0,0,0,.7);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch-tile .txt>span{font-size:12px;color:#C9D3E3;font-weight:600}
.ch-tile .bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}
.ch-tile .bar i{display:block;height:100%;background:var(--mint)}
@media(max-width:480px){.ch-tile .txt b{font-size:14px}.ch-tile .cn{width:30px;height:30px;font-size:13px;border-radius:9px}}
.vw-chap .ch-foot{max-width:960px;margin:22px auto 0;display:flex;justify-content:center}
.vw-chap .ch-foot .btn{padding:14px 26px}
.viewer.light .vw-chap{background:#fff;color:#000}
.viewer.light .vw-chap .ch-bar .round{background:rgba(0,0,0,.08);color:#000}
.viewer.light .vw-chap .ch-sub,.viewer.light .vw-chap .ch-sub2{color:#525252}
.viewer.light .ch-tile{background:#EFEFEF;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.tt-wrap.clickable{cursor:pointer}
.chkmodes{display:flex;flex-direction:column;gap:8px;margin:10px 0 0 30px}
.chkmodes label{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:600;cursor:pointer}
.chkmodes input{margin-top:3px}
.vw-end .card{background:#0D2447;color:#fff;padding:24px;max-width:480px;width:100%}
.vw-end .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.vw-end .sum div{background:#12305C;border-radius:10px;padding:10px;text-align:center}
.vw-end .sum b{display:block;font-size:22px}
.vw-end .sum span{font-size:11px;color:#7F93B3;text-transform:uppercase;letter-spacing:.05em}
.vw-end .nok-list{font-size:13px;display:grid;gap:6px;color:#B8C6DB}
.vw-end .nok-list img{width:56px;height:56px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-left:6px}

/* ---------- Results / share ---------- */
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th,table.res td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.res th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
.ok-n{color:var(--mint-ink);font-weight:800}
.nok-n{color:var(--red);font-weight:800}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.qr-wrap #qr img,.qr-wrap #qr canvas{border-radius:10px;background:#fff;padding:10px}
.linkbox{display:flex;gap:6px;width:100%}
.linkbox input{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px;min-width:0}
.notice{padding:10px 12px;border-radius:10px;background:rgba(245,165,36,.15);color:#9a6300;font-size:13px;font-weight:600}
.notice.blue{background:rgba(0,78,173,.1);color:var(--blue)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== v1.1 polish ===== */
html,body{overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
#app{overflow-x:clip;min-height:100%}
body{-webkit-tap-highlight-color:transparent}
:root{--radius:18px;--shadow:0 10px 30px rgba(1,39,86,.09),0 1px 2px rgba(1,39,86,.06)}
.card{border:1px solid rgba(1,39,86,.06)}
.topbar{background:linear-gradient(90deg,#012756 0%,#0a3a7c 100%);backdrop-filter:saturate(1.2);flex-wrap:nowrap;gap:8px}
.topbar .tb-btn{white-space:nowrap;padding:8px 10px}
@media(max-width:560px){.brand small:not(.ver){display:none}.topbar .tb-btn[data-logout]{display:none}.topbar .tb-btn[data-profile]{max-width:150px;overflow:hidden;text-overflow:ellipsis}}
.btn{box-shadow:0 2px 6px rgba(1,39,86,.12)}
.btn.ghost{box-shadow:none}
.btn.mint{background:linear-gradient(135deg,#1fe3ad,#03D39B)}
.btn:not(.ghost):not(.mint):not(.danger){background:linear-gradient(135deg,#0a63d6,#004EAD)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;width:max-content;max-width:100%;margin-bottom:14px}
.tabs button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(1,39,86,.12)}

/* tools: horizontal, labeled, scrollable on phones */

/* ---------- Storage (IndexedDB with memory fallback) ---------- */
const DB = (() => {
  const mem = {instr:new Map(), media:new Map(), runs:new Map()};
  let db = null, failed = false;
  const open = () => new Promise(res => {
    if(db||failed) return res(db);
    try{
      const rq = indexedDB.open('giri-go', 1);
      rq.onupgradeneeded = e => { const d = e.target.result; ['instr','media','runs'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); }); };
      rq.onsuccess = e => { db = e.target.result; res(db); };
      rq.onerror = () => { failed = true; res(null); };
    }catch(e){ failed = true; res(null); }
  });
  const tx = (store, mode, fn) => open().then(d => new Promise((res, rej) => {
    if(!d){ try{ res(fn(null, store)); }catch(e){ rej(e); } return; }
    const tr = d.transaction(store, mode); const st = tr.objectStore(store);
    const r = fn(st, store); if(!r){ tr.oncomplete = () => res(); tr.onerror = () => rej(tr.error); return; }
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    put:(s,o) => tx(s,'readwrite',(st,name)=> st ? st.put(o) : (mem[name].set(o.id,o), null)),
    get:(s,id) => tx(s,'readonly',(st,name)=> st ? st.get(id) : mem[name].get(id)),
    del:(s,id) => tx(s,'readwrite',(st,name)=> st ? st.delete(id) : (mem[name].delete(id), null)),
    all:(s) => tx(s,'readonly',(st,name)=> st ? st.getAll() : [...mem[name].values()])
  };
})();

const mdInline = s => s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/==([^=]+)==/g, '<span class="keep">$1</span>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (m, p, u) => p + '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
function mdToHtml(src){
  const lines = String(src||'').split(/\r?\n/); let out = '', list = null; const closeList = () => { if(list){ out += `</${list}>`; list = null; } };
  for(const raw of lines){ const line = esc(raw); let m;
    if((m = /^\s*[-*•]\s+(.*)$/.exec(line))){ if(list!=='ul'){ closeList(); out += '<ul>'; list='ul'; } out += `<li>${mdInline(m[1])}</li>`; }
    else if((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))){ if(list!=='ol'){ closeList(); out += '<ol>'; list='ol'; } out += `<li>${mdInline(m[1])}</li>`; }
    else { closeList(); if(line.trim()!=='') out += `<p>${mdInline(line)}</p>`; } }
  closeList(); return out;
}

/* ---------- Upload-Queue (Clips erst lokal, dann im Hintergrund hoch) ---------- */
const UP = { running:false, total:0, done:0, failed:0, conv:null };
const extOf = blob => (blob.type||'').includes('mp4') ? 'mp4' : (blob.type||'').includes('webm') ? 'webm' : (blob.type||'').includes('png') ? 'png' : 'jpg';
function syncUI(){
  let e = $('#sync'); if(!e){ e = el('<div class="sync" id="sync"><span id="sync-t"></span><span class="bar"><i id="sync-b"></i></span></div>'); document.body.appendChild(e); }
  const pending = UP.total - UP.done - UP.failed;
  if(!UP.running && pending<=0 && !UP.failed){ e.classList.remove('show','err'); return; }
  e.classList.add('show'); e.classList.toggle('err', UP.failed>0 && !UP.running);
  $('#sync-t').textContent = UP.failed && !UP.running ? `${UP.failed} ${t('upload_failed')}` : (UP.conv!=null ? `${t('converting')} ${Math.round(UP.conv*100)} % · ${UP.done+1}/${UP.total}` : `${t('uploading')} ${UP.done}/${UP.total}`);
  $('#sync-b').style.width = (UP.total ? 100*UP.done/UP.total : 0)+'%';
}
async function runUploads(){
  if(!sb || !S.user || UP.running) return; UP.running = true;
  try{
    const all = (await DB.all('media')).filter(m => (m.blob||m.buf) && !m.remote && m.ws === S.user.ws);
    UP.total = all.length; UP.done = 0; UP.failed = 0; syncUI();
    for(const m of all){
      let blob = mediaBlob(m);
      if(m.type==='video' && !isCompatVideo(blob.type, m.w, m.h, blob.size) && canConvert() && !m.convFailed){
        UP.conv = 0; syncUI(); const r = await convertVideo(blob, p => { UP.conv = p; syncUI(); }); UP.conv = null;
        if(r){ m.buf = await r.blob.arrayBuffer(); m.mime = 'video/mp4'; delete m.blob; m.w = r.w; m.h = r.h; m.duration = r.duration; m.converted = true; await DB.put('media', m); blob = mediaBlob(m); if(S.mediaURL.has(m.id)){ try{ URL.revokeObjectURL(S.mediaURL.get(m.id)); }catch(e){} S.mediaURL.delete(m.id); } }
        else { m.convFailed = true; await DB.put('media', m); }
      }
      const path = `${m.ws}/${m.instrId}/${m.id}.${extOf(blob)}`;
      const {error} = await sb.storage.from('media').upload(path, blob, {upsert:true, contentType: blob.type || undefined});
      if(error){ UP.failed++; syncUI(); continue; }
      const url = PUBLIC_MEDIA(path);
      m.remote = url; m.path = path; await DB.put('media', m); S.remoteUrl.set(m.id, url);
      // Schritt in der Anleitung mit Remote-URL versehen (frische Server-Version holen, um nichts zu überschreiben)
      const inst = await fetchInstr(m.instrId);
      if(inst){ const st = (inst.steps||[]).find(s => s.mediaId === m.id); if(st && !st.mediaUrl){ const patch = {mediaUrl:url, mediaPath:path}; if(m.converted){ patch.w = m.w; patch.h = m.h; if(m.duration){ patch.duration = m.duration; if(!st.trimEnd || st.trimEnd > m.duration) patch.trimEnd = m.duration; } } Object.assign(st, patch); await saveInstr(inst); const local = S.instrs.find(i=>i.id===inst.id); if(local){ const ls = local.steps.find(s=>s.mediaId===m.id); if(ls) Object.assign(ls, patch); } } }
      UP.done++; syncUI();
    }
  } finally { UP.running = false; syncUI(); if(UP.failed) setTimeout(()=>{ UP.failed=0; syncUI(); }, 6000); }
}
window.addEventListener('online', () => runUploads());

const posterCache = new Map();
async function stepPoster(step){
  if(step.poster && !(step.type==='video' && (step.trimStart||0) > 0.3)) return step.poster;
  if(!step.mediaId) return null;
  const key = step.mediaId + ':' + (step.trimStart||0);
  if(posterCache.has(key)) return posterCache.get(key);
  const url = await mediaUrl(step.mediaId); if(!url) return null;
  if(step.type==='photo'){ posterCache.set(key,url); return url; }
  const p = grabFrame(url, step.trimStart||0).then(c => c ? c.toDataURL('image/jpeg', .7) : (step.poster||null)).catch(()=>step.poster||null);
  posterCache.set(key, p); return p;
}
function grabFrame(url, time, maxW=640){
  return new Promise((res) => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline',''); v.preload='auto'; v.crossOrigin='anonymous'; let done = false;
    const finish = () => { if(done) return; done = true; try{ const s = Math.min(1, maxW/(v.videoWidth||1)); const c = document.createElement('canvas'); c.width = Math.round((v.videoWidth||640)*s); c.height = Math.round((v.videoHeight||480)*s); c.getContext('2d').drawImage(v,0,0,c.width,c.height); res(c); }catch(e){ res(null); } try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} };
    const seek = async () => { try{ await v.play(); }catch(e){} try{ v.pause(); }catch(e){} try{ v.currentTime = Math.max(0.05, time); }catch(e){ finish(); } };
    v.addEventListener('loadedmetadata', seek, {once:true});
    v.addEventListener('seeked', () => setTimeout(finish, 60), {once:true});
    v.addEventListener('error', () => { done = true; res(null); }, {once:true});
    setTimeout(() => { if(!done) finish(); }, 5000);
    v.src = url; try{ v.load(); }catch(e){}
  });
}
const posterFromCanvas = (src, w, h, maxW=320) => { try{ const sc = Math.min(1, maxW/(w||1)); const c = document.createElement('canvas'); c.width = Math.round((w||320)*sc); c.height = Math.round((h||240)*sc); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .6); }catch(e){ return null; } };

// files → steps, inserted after `afterStepId` (or appended); returns the new steps
async function importFiles(instr, files, afterStepId){

  const prog = el(`<div class="modal-bg"><div class="modal" style="max-width:360px"><h2>${t('importing')}</h2><div class="muted" id="imp-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">&nbsp;</div><div class="pbar2"><i id="imp-bar"></i></div><div class="tnum" id="imp-cnt"></div></div></div>`); $('#modals').appendChild(prog);
  const added = [], errors = []; let at = afterStepId ? instr.steps.findIndex(x=>x.id===afterStepId) : instr.steps.length-1; if(at < 0) at = instr.steps.length-1;

    for(const [k,f] of list.entries()){

      const onP = p => { prog.querySelector('#imp-bar').style.width = (100*(k+p)/list.length)+'%'; prog.querySelector('#imp-cnt').textContent = `${k+1} / ${list.length} · ${t('converting')} ${Math.round(p*100)} %`; };
      try{ const m = await fileToMedia(f, onP); const mid = uid(); await putMedia({id:mid, blob:m.blob, w:m.w, h:m.h, type:m.type, ws:instr.ws, instrId:instr.id});
        const ns = {id:uid(), type:m.type, mediaId:mid, w:m.w, h:m.h, duration:m.duration, trimStart:0, trimEnd: m.type==='video' ? Math.min(m.duration, 15) : 0, title:'', desc:'', warn:'', ann:[], poster:m.poster||null};
        instr.steps.splice(at+1, 0, ns); at++; added.push(ns); }

  if(errors.length) setTimeout(() => toast(errors.slice(0,2).join(' · ')), added.length ? 2300 : 0);

}
// full-window drop target (PC): shows an overlay while files are dragged over the page
function attachDropImport(onFiles, hintFn){
  let depth = 0; const zone = el(`<div class="dropzone" hidden><div class="dz-in">${IC.upload}<b>${t('import_hint')}</b><span id="dz-sub"></span></div></div>`); document.body.appendChild(zone);
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
  const enter = e => { if(!hasFiles(e)) return; e.preventDefault(); depth++; zone.querySelector('#dz-sub').textContent = hintFn ? hintFn() : ''; zone.hidden = false; };
  const over = e => { if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
  const leave = e => { if(!hasFiles(e)) return; depth = Math.max(0, depth-1); if(!depth) zone.hidden = true; };
  const drop = e => { if(!hasFiles(e)) return; e.preventDefault(); depth = 0; zone.hidden = true; const files = [...e.dataTransfer.files]; if(files.length) onFiles(files); };
  document.addEventListener('dragenter', enter); document.addEventListener('dragover', over); document.addEventListener('dragleave', leave); document.addEventListener('drop', drop);
  return () => { document.removeEventListener('dragenter', enter); document.removeEventListener('dragover', over); document.removeEventListener('dragleave', leave); document.removeEventListener('drop', drop); zone.remove(); };
}

/* ---------- Custom symbols (workspace library) ---------- */
// file → PNG ≤ 512 px (alpha kept), uploaded to media/<ws>/symbols/<id>.png, entry in workspaces.symbols
async function symbolFromFile(file){
  const img = await new Promise((res, rej) => { const i = new Image(); const u = URL.createObjectURL(file); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad')); }; i.src = u; });
  const iw = img.naturalWidth || img.width || 512, ih = img.naturalHeight || img.height || 512; const sc = Math.min(1, 512/Math.max(iw, ih));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(iw*sc)); c.height = Math.max(1, Math.round(ih*sc)); const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
  let alpha = false; try{ const d = ctx.getImageData(0, 0, c.width, c.height).data; for(let i=3; i<d.length; i+=4*7){ if(d[i] < 240){ alpha = true; break; } } }catch(e){}
  const blob = await new Promise(res => c.toBlob(res, 'image/png')); if(!blob) throw new Error('png');
  const id = uid(); const path = `${S.user.ws}/symbols/${id}.png`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType:'image/png', upsert:true}); if(up.error) throw up.error;
  const name = (file.name||'Symbol').replace(/\.[a-z0-9]+$/i, '').slice(0, 24);
  return {id, name, url: PUBLIC_MEDIA(path), path, ar: c.width/c.height, alpha, at: Date.now()};
}

/* ---------- Charts (canvas, no library) ---------- */
function barChart(cv, labels, values, opts={}){
  const dpr = window.devicePixelRatio||1; const W = cv.clientWidth||600, H = cv.clientHeight||220; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);

  const col = opts.color||'#004EAD', ink = opts.ink||'#525252', line = opts.line||'rgba(0,0,0,.08)'; const max = Math.max(1, ...values);
  ctx.font = '600 11px Montserrat, sans-serif'; ctx.fillStyle = ink; ctx.textBaseline = 'middle';
  if(opts.horizontal){
    const lw = Math.min(W*0.42, 190); const rowH = Math.min(30, (H-6)/Math.max(1, values.length)); const x0 = lw+8, bw = W - x0 - 44;
    values.forEach((val, i) => { const y = 3 + i*rowH + rowH/2; let lab = labels[i]||''; while(ctx.measureText(lab).width > lw-6 && lab.length > 3) lab = lab.slice(0,-2); if(lab !== labels[i]) lab += '…';
      ctx.textAlign = 'right'; ctx.fillStyle = ink; ctx.fillText(lab, x0-8, y); const w = bw*val/max; ctx.fillStyle = col; rr(ctx, x0, y-rowH*0.32, Math.max(2, w), rowH*0.64, 4); ctx.fill(); ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.fillText(String(val), x0+w+6, y); });
    return;
  }
  const padL = 30, padB = 22, padT = 8; const cw = W-padL-6, ch = H-padT-padB; const n = values.length; const bw = cw/Math.max(1,n);
  ctx.strokeStyle = line; ctx.lineWidth = 1; const ticks = Math.max(1, Math.min(4, max)); ctx.textAlign = 'right';
  for(let k=0;k<=ticks;k++){ const y = padT + ch - ch*k/ticks; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-6, y); ctx.stroke(); ctx.fillStyle = ink; ctx.fillText(String(Math.round(max*k/ticks)), padL-6, y); }
  values.forEach((val, i) => { const x = padL + i*bw + bw*0.15, w = bw*0.7, h = ch*val/max; ctx.fillStyle = col; rr(ctx, x, padT+ch-h, w, Math.max(h, val?2:0), Math.min(4, w/2)); ctx.fill(); });
  ctx.textAlign = 'center'; ctx.fillStyle = ink; const every = Math.ceil(n/ (W<420 ? 5 : 8)); let lastDrawn = -99;
  labels.forEach((lab, i) => { const isLast = i===n-1; if((i%every) && !isLast) return; if(isLast && i-lastDrawn < every*0.6) return; lastDrawn = i; ctx.fillText(lab, padL + i*bw + bw/2, H-padB/2); });
}

async function renderResults(app, id){

    sb.from('views').select('*').eq('instr_id', id).order('started_at', {ascending:false}).limit(2000) ]);
  if(error) toast(error.message);
  const runs = (rows||[]).map(r => ({id:r.id, instrId:r.instr_id, worker:r.worker, version:r.version, startedAt:new Date(r.started_at).getTime(), finishedAt:r.finished_at?new Date(r.finished_at).getTime():0, items:r.items||{}}));
  const views = vrows||[]; const vN = views.length, vReload = views.filter(x=>x.reload).length, vDone = views.filter(x=>x.completed).length; const withDur = views.filter(x=>x.duration_s>0); const avgDur = withDur.length ? Math.round(withDur.reduce((a,x)=>a+x.duration_s,0)/withDur.length) : 0; const avgSeen = views.length ? (views.reduce((a,x)=>a+(x.steps_seen||0),0)/views.length) : 0;
  const fmtDur = sec => `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  const lastAt = r => Math.max(r.startedAt, ...Object.values(r.items).map(i=>i.at||0));
  const dur = r => fmtDur(Math.max(0, Math.round(((r.finishedAt||lastAt(r))-r.startedAt)/1000)));
  const days = []; for(let k=29;k>=0;k--){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-k); days.push(d); } const dkey = d => d.toISOString().slice(0,10); const perDay = Object.fromEntries(days.map(d=>[dkey(d),0])); views.forEach(x => { const d = new Date(x.started_at||0); if(isNaN(d)) return; const k = dkey(d); if(perDay[k]!=null) perDay[k]++; });
  let tab = 'views'; try{ tab = sessionStorage.getItem('gg_rtab_'+id) || 'views'; }catch(e){}

async function stepImages(s, count){

  const out = []; for(const tm of [...new Set(times.map(x=>Math.round(x*10)/10))].slice(0,count)){ const c = await grabFrame(url, tm, 900); if(c) out.push(withAnn(c, tm)); }

}

if('serviceWorker' in navigator && /^https:/.test(location.protocol)){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
/* ---------- Update check (GitHub Pages / Safari cache) ---------- */
async function checkUpdate(){
  try{ const r = await fetch(location.pathname.endsWith('/') ? location.pathname+'index.html' : location.pathname, {cache:'no-store'}); const txt = await r.text(); const m = /APP_VERSION = '([^']+)'/.exec(txt); if(!m || m[1]===APP_VERSION) return;
    const n = el(`<div class="sync show" id="upd-note" style="pointer-events:auto;cursor:pointer;background:var(--blue)">${t('update_avail',{v:m[1]})}</div>`); n.onclick = () => location.replace(location.pathname + '?v=' + m[1] + location.hash); document.body.appendChild(n);
  }catch(e){}
}
setTimeout(checkUpdate, 2500);

(function boot(){

})();
